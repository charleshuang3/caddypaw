name: Test on Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.27.1'
  GOIMPORTS_VERSION: v0.50.0
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Format check
        run: |
          test -z "$($(go env GOPATH)/bin/goimports -local github.com/charleshuang3/caddypaw -l .)"

      - name: Lint check
        run: |
          $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Run tests
        run: |
          go test -v ./...

      - name: Run tests with the race detector
        run: |
          CGO_ENABLED=1 go test -race ./...
